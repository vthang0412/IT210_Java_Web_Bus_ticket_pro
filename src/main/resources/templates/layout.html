<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:fragment="layout">

<head>

    <meta charset="UTF-8">

    <title>
        Bus Ticket Pro
    </title>

    <link rel="stylesheet"
          th:href="@{/css/style.css}">

    <link rel="stylesheet"
          th:href="@{/css/header.css}">

    <link rel="stylesheet"
          th:href="@{/css/footer.css}">
<style>
    /* ================= GLOBAL ================= */
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: 'Segoe UI', sans-serif;
    }

    body {
        background: #f3f6ff;
        color: #1f2937;
    }

    /* ================= NAVBAR ================= */
    .navbar {
        background: linear-gradient(135deg, #0f172a, #1e293b);
        padding: 14px 40px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        box-shadow: 0 6px 20px rgba(0,0,0,0.2);
        position: sticky;
        top: 0;
        z-index: 1000;
    }

    .logo a {
        color: #fff;
        font-size: 22px;
        font-weight: 700;
        text-decoration: none;
        letter-spacing: 1px;
    }

    .menu {
        display: flex;
        align-items: center;
        gap: 18px;
    }

    .menu a {
        color: #e5e7eb;
        text-decoration: none;
        font-size: 14px;
        padding: 8px 12px;
        border-radius: 8px;
        transition: 0.3s;
    }

    .menu a:hover {
        background: rgba(255,255,255,0.1);
        color: #38bdf8;
    }

    /* USER */
    .user-dropdown {
        position: relative;
    }

    .user-btn {
        background: rgba(255,255,255,0.1);
        border: none;
        padding: 8px 14px;
        border-radius: 999px;
        color: white;
        cursor: pointer;
        transition: 0.3s;
    }

    .user-btn:hover {
        background: rgba(255,255,255,0.2);
    }

    .dropdown-content {
        display: none;
        position: absolute;
        right: 0;
        top: 45px;
        background: white;
        width: 180px;
        border-radius: 12px;
        box-shadow: 0 10px 25px rgba(0,0,0,0.15);
        overflow: hidden;
    }

    .dropdown-content a {
        display: block;
        padding: 12px 16px;
        text-decoration: none;
        color: #111827;
    }

    .dropdown-content a:hover {
        background: #f1f5f9;
    }

    .user-dropdown:hover .dropdown-content {
        display: block;
    }

    .dropdown-content.show-menu {
        display: block;
    }

    /* ================= AUTH ================= */
    .auth-container {
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 60px 20px;
    }

    .auth-card {
        display: flex;
        width: 950px;
        background: white;
        border-radius: 18px;
        overflow: hidden;
        box-shadow: 0 15px 40px rgba(0,0,0,0.15);
    }

    /* LEFT */
    .auth-left {
        flex: 1;
        background: linear-gradient(135deg, #2563eb, #1e40af);
        color: white;
        padding: 40px;
        display: flex;
        flex-direction: column;
        justify-content: center;
        text-align: center;
    }

    .auth-left h1 {
        font-size: 28px;
        margin-bottom: 10px;
    }

    .auth-left p {
        font-size: 14px;
        opacity: 0.9;
    }

    .auth-left img {
        width: 100%;
        margin-top: 20px;
    }

    /* RIGHT */
    .auth-right {
        flex: 1;
        padding: 40px;
    }

    .auth-right h2 {
        text-align: center;
        margin-bottom: 25px;
        color: #1e3a8a;
    }

    .auth-right input {
        width: 100%;
        padding: 12px;
        margin-bottom: 12px;
        border: 1px solid #d1d5db;
        border-radius: 10px;
        outline: none;
        transition: 0.3s;
    }

    .auth-right input:focus {
        border-color: #2563eb;
        box-shadow: 0 0 8px rgba(37,99,235,0.2);
    }

    .auth-right button {
        width: 100%;
        padding: 12px;
        background: linear-gradient(135deg, #2563eb, #1e40af);
        color: white;
        border: none;
        border-radius: 10px;
        font-weight: bold;
        cursor: pointer;
        transition: 0.3s;
        margin-top: 10px;
    }

    .auth-right button:hover {
        transform: translateY(-2px);
    }

    /* ERROR */
    .auth-right small {
        color: red;
        font-size: 12px;
    }

    /* LINK */
    .auth-link {
        text-align: center;
        margin-top: 15px;
    }

    .auth-link a {
        color: #2563eb;
        font-weight: bold;
        text-decoration: none;
    }

    /* ================= RESPONSIVE ================= */
    @media (max-width: 768px) {
        .auth-card {
            flex-direction: column;
            width: 100%;
        }

        .menu {
            flex-wrap: wrap;
            justify-content: center;
        }
    }
    /* FULL PAGE FLEX LAYOUT */
    body {
        display: flex;
        flex-direction: column;
        min-height: 100vh;
    }

    /* CONTENT CHIẾM KHÔNG GIAN */
    .main-container {
        flex: 1;
    }

    /* FOOTER */
    .footer {
        background: #0f172a;
        color: white;
        text-align: center;
        padding: 15px;
        margin-top: auto;
    }
</style>
</head>

<body>

<header th:replace="~{fragments/header :: header}"></header>

<main class="main-container">
    <div th:replace="~{::content}"></div>
</main>

<footer th:replace="~{fragments/footer :: footer}"></footer>

<script th:src="@{/css/js/app.js}"></script>

</body>
</html>
