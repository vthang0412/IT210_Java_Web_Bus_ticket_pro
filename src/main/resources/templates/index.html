<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      th:replace="~{layout :: layout}">

<div th:fragment="content">

    <style>
        .search-page {
            max-width: 1180px;
            margin: 0 auto;
        }

        .search-panel {
            background: white;
            border-radius: 8px;
            box-shadow: 0 4px 18px rgba(15, 23, 42, 0.08);
            overflow: hidden;
            margin-bottom: 22px;
        }

        .search-panel__title {
            background: #0d6efd;
            color: white;
            padding: 16px 20px;
            font-size: 20px;
            font-weight: 700;
        }

        .search-form {
            display: grid;
            grid-template-columns: 1fr 1fr 220px auto;
            gap: 14px;
            padding: 20px;
            align-items: end;
        }

        .field label {
            display: block;
            font-weight: 700;
            color: #1f2937;
            margin-bottom: 8px;
        }

        .field select,
        .field input {
            width: 100%;
            height: 44px;
            border: 1px solid #d1d5db;
            border-radius: 6px;
            padding: 0 12px;
            background: #fff;
            font-size: 15px;
        }

        .field input.error-input,
        .field select.error-input {
            border-color: #dc3545;
            background: #fff7f7;
        }

        .form-error {
            color: #dc3545;
            font-size: 13px;
            font-weight: 700;
            margin-top: 6px;
        }

        .global-error {
            grid-column: 1 / -1;
            background: #fff1f2;
            border: 1px solid #fecdd3;
            color: #be123c;
            border-radius: 6px;
            padding: 10px 12px;
            font-weight: 700;
        }

        .search-button {
            height: 44px;
            border: none;
            border-radius: 6px;
            padding: 0 24px;
            background: #ffc107;
            color: #1f2937;
            font-weight: 800;
            cursor: pointer;
            box-shadow: 0 3px 8px rgba(245, 158, 11, 0.28);
        }

        .result-card {
            background: white;
            border-radius: 8px;
            box-shadow: 0 4px 18px rgba(15, 23, 42, 0.08);
            padding: 20px;
        }

        .result-card h2 {
            font-size: 20px;
            margin-bottom: 16px;
            color: #111827;
        }

        .trip-table {
            width: 100%;
            border-collapse: collapse;
            overflow: hidden;
        }

        .trip-table th {
            background: #0d6efd;
            color: white;
            padding: 13px;
            text-align: left;
            font-weight: 700;
        }

        .trip-table td {
            padding: 14px 13px;
            border-bottom: 1px solid #e5e7eb;
            color: #1f2937;
        }

        .trip-table tr:hover td {
            background: #f8fafc;
        }

        .route-name {
            color: #0d6efd;
            font-weight: 800;
        }

        .price-text {
            color: #dc3545;
            font-weight: 800;
        }

        .choose-btn {
            display: inline-block;
            border-radius: 6px;
            padding: 9px 14px;
            background: #ffc107;
            color: #1f2937;
            text-decoration: none;
            font-weight: 800;
        }

        .login-btn {
            background: #0d6efd;
            color: white;
        }

        .empty-state {
            padding: 20px;
            border: 1px dashed #cbd5e1;
            border-radius: 8px;
            color: #64748b;
            text-align: center;
        }

        @media (max-width: 900px) {
            .search-form {
                grid-template-columns: 1fr;
            }
        }
    </style>

    <div class="search-page">

        <section class="search-panel">
            <div class="search-panel__title">Tìm chuyến xe</div>

            <form class="search-form"
                  th:action="@{/search}"
                  th:object="${searchRequest}"
                  method="get">

                <div class="global-error"
                     th:if="${#fields.hasGlobalErrors()}"
                     th:each="err : ${#fields.globalErrors()}"
                     th:text="${err}">
                </div>

                <div class="field">
                    <label>Điểm đi</label>
                    <select th:field="*{fromId}"
                            th:classappend="${#fields.hasErrors('fromId')} ? 'error-input'">
                        <option value="">Chọn điểm đi</option>
                        <option th:each="l : ${locations}"
                                th:value="${l.id}"
                                th:text="${l.name}">
                        </option>
                    </select>
                    <div class="form-error"
                         th:if="${#fields.hasErrors('fromId')}"
                         th:errors="*{fromId}">
                    </div>
                </div>

                <div class="field">
                    <label>Điểm đến</label>
                    <select th:field="*{toId}"
                            th:classappend="${#fields.hasErrors('toId')} ? 'error-input'">
                        <option value="">Chọn điểm đến</option>
                        <option th:each="l : ${locations}"
                                th:value="${l.id}"
                                th:text="${l.name}">
                        </option>
                    </select>
                    <div class="form-error"
                         th:if="${#fields.hasErrors('toId')}"
                         th:errors="*{toId}">
                    </div>
                </div>

                <div class="field">
                    <label>Ngày đi</label>
                    <input type="date"
                           th:field="*{departureDate}"
                           th:classappend="${#fields.hasErrors('departureDate')} ? 'error-input'">
                    <div class="form-error"
                         th:if="${#fields.hasErrors('departureDate')}"
                         th:errors="*{departureDate}">
                    </div>
                </div>

                <button class="search-button" type="submit">Tìm chuyến</button>

            </form>
        </section>

        <section class="result-card">
            <h2>Danh sách chuyến</h2>

            <div class="empty-state" th:if="${#lists.isEmpty(trips)}">
                Chọn điểm đi, điểm đến và ngày đi để tìm chuyến phù hợp.
            </div>

            <table class="trip-table" th:if="${!#lists.isEmpty(trips)}">
                <tr>
                    <th>Tuyến</th>
                    <th>Xe</th>
                    <th>Giờ đi</th>
                    <th>Giá</th>
                    <th>Hành động</th>
                </tr>

                <tr th:each="t : ${trips}">
                    <td class="route-name" th:text="${t.route.fromLocation.name + ' -> ' + t.route.toLocation.name}"></td>
                    <td th:text="${t.bus.busType + ' (' + t.bus.licensePlate + ')'}"></td>
                    <td th:text="${t.departureTime}"></td>
                    <td class="price-text" th:text="${#numbers.formatDecimal(t.price, 0, 'COMMA', 0, 'POINT') + ' đ'}"></td>
                    <td>
                        <a sec:authorize="hasRole('PASSENGER')"
                           class="choose-btn"
                           th:href="@{'/seats/' + ${t.id}}">
                            Chọn ghế
                        </a>
                        <a sec:authorize="!isAuthenticated()"
                           class="choose-btn login-btn"
                           th:href="@{/login}">
                            Đăng nhập để đặt vé
                        </a>
                        <span sec:authorize="hasAnyRole('ADMIN','STAFF')">
                            Không áp dụng
                        </span>
                    </td>
                </tr>
            </table>
        </section>

    </div>

</div>

</html>
