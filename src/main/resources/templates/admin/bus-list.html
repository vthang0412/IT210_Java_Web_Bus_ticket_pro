<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout :: layout}">

<body>

<div th:fragment="content">

    <div class="card">

        <div class="top-bar">

            <h1>Quản lý xe</h1>

            <a class="btn btn-success"
               th:href="@{/admin/buses/create}">
                Thêm xe
            </a>

        </div>

        <table>

            <thead>
            <tr>
                <th>Biển số</th>
                <th>Loại xe</th>
                <th>Số ghế</th>
                <th>Hãng</th>
                <th>Tài xế</th>
                <th>Hành động</th>
            </tr>
            </thead>

            <tbody>

            <!-- empty state -->
            <tr th:if="${#lists.isEmpty(buses)}">
                <td colspan="6" style="text-align:center;">
                    Chưa có dữ liệu xe
                </td>
            </tr>

            <tr th:each="bus : ${buses}">

                <td th:text="${bus.licensePlate}"></td>
                <td th:text="${bus.busType}"></td>
                <td th:text="${bus.totalSeats}"></td>
                <td th:text="${bus.companyName}"></td>
                <td th:text="${bus.driverName}"></td>

                <td>

                    <a class="btn btn-primary"
                       th:href="@{'/admin/buses/edit/' + ${bus.id}}">
                        Sửa
                    </a>

                    <!-- DELETE SAFE (POST + CONFIRM) -->
                    <form th:action="@{'/admin/buses/delete/' + ${bus.id}}"
                          method="post"
                          style="display:inline;">

                        <button type="submit"
                                class="btn btn-danger"
                                onclick="return confirm('Bạn có chắc muốn xóa xe này?')">
                            Xóa
                        </button>

                    </form>

                </td>

            </tr>

            </tbody>

        </table>

    </div>

</div>

</body>
</html>
