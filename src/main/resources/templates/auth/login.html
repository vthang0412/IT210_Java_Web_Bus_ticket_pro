<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout}">

<div th:fragment="content">

    <div class="auth-container">

        <div class="auth-card">

            <!-- LEFT -->
            <div class="auth-left">
                <h1>Bus Ticket Pro</h1>
                <p>Đặt vé nhanh chóng - an toàn - tiện lợi</p>
                <img th:src="@{/images/bus.png}" alt="">
            </div>

            <!-- RIGHT -->
            <div class="auth-right">

                <h2>Đăng nhập</h2>

                  <!-- GLOBAL / LOGOUT MESSAGES -->
                  <p th:if="${param.logout}"
                     style="color:green;">
                      Đăng xuất thành công
                  </p>

                  <!-- FORM -->
                  <form method="post"
                     th:action="@{/login}"
                     th:object="${loginRequest}">

                      <input type="text"
                          th:field="*{username}"
                          placeholder="Username">

                      <p class="error" th:if="${#fields.hasErrors('username')}" th:errors="*{username}"></p>

                      <input type="password"
                          th:field="*{password}"
                          placeholder="Password">

                      <p class="error" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></p>

                      <p class="error" th:if="${#fields.hasGlobalErrors()}" th:each="err : ${#fields.globalErrors()}" th:text="${err.defaultMessage}"></p>

                      <button type="submit">Đăng nhập</button>
                  </form>

                <div class="auth-link">
                    Chưa có tài khoản?
                    <a th:href="@{/register}">Đăng ký</a>
                </div>

            </div>

        </div>

    </div>

</div>

<!-- CSS -->
<style>
    .error {
        color: red;
        font-size: 13px;
        margin: 5px 0;
    }
</style>

<!-- no client-side JS validation; server-side messages displayed above -->

</html>
