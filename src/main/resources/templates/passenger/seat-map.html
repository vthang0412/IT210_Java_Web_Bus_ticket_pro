<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      th:replace="~{layout :: layout}">

<head>

    <style>

        .seat-grid{

            display:grid;

            grid-template-columns:
                    repeat(4,1fr);

            gap:20px;
        }

        .seat{

            padding:20px;

            border-radius:10px;

            text-align:center;

            font-weight:bold;
        }

        .available{
            background:#22c55e;
        }

        .pending{
            background:#f59e0b;
        }

        .booked{
            background:#ef4444;
        }

        .seat a{
            color:white;
            text-decoration:none;
        }

        .legend{
            display:flex;
            gap:20px;
            margin-bottom:20px;
        }

    </style>

</head>

<body>

<div th:fragment="content">

    <div class="card">

        <h1>Sơ đồ ghế</h1>

        <br>

        <div class="legend">

            <div class="seat available">
                AVAILABLE
            </div>

            <div class="seat pending">
                PENDING
            </div>

            <div class="seat booked">
                BOOKED
            </div>

        </div>

        <div class="seat-grid">

            <div

                    th:each="seat : ${seats}"

                    th:classappend="
                    ${seat.status.name() == 'AVAILABLE'}
                    ? 'seat available'
                    :
                    (
                    ${seat.status.name() == 'PENDING'}
                    ? 'seat pending'
                    :
                    'seat booked'
                    )">

                <!-- AVAILABLE -->

                <a
                        sec:authorize="hasRole('PASSENGER')"
                        th:if="${seat.status.name() == 'AVAILABLE'}"
                        th:href="@{'/booking?seatId=' + ${seat.id}}"
                        th:text="${seat.seatNumber}">

                </a>

                <!-- If user is not passenger, show number only for available seats -->
                <span sec:authorize="!hasRole('PASSENGER')"
                      th:if="${seat.status.name() == 'AVAILABLE'}"
                      th:text="${seat.seatNumber}"></span>

                <!-- DISABLED -->

                <span

                        th:if=
                                "${seat.status.name() != 'AVAILABLE'}"

                        th:text="${seat.seatNumber}">

                </span>

            </div>

        </div>

    </div>

</div>

</body>
</html>
